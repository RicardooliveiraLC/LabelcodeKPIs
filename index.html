<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#2c3a4b;--ink-soft:#8a97a8;--line:#eef1f5;--brand:#5b6cff;--shadow:0 6px 22px rgba(40,55,90,.06);--shadow-kpi:0 12px 26px rgba(40,55,90,.16);--radius:14px;--mob-bar:60px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:216px;background:#fff;flex-shrink:0;padding:22px 0 30px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 22px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#5b6cff,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:15px}.brand span{display:block;font-size:10px;color:var(--ink-soft);font-weight:500}
.nav-group{font-size:10px;color:#b7c0cf;font-weight:700;letter-spacing:.8px;padding:14px 22px 5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 22px;font-size:13.5px;color:var(--ink-soft);font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:.15s;user-select:none}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{color:var(--ink);background:#f7f8fb}
.nav-item.active{color:var(--brand);background:#f1f2ff;border-left-color:var(--brand);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:10}
.burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;cursor:pointer;padding:4px;flex-shrink:0;background:none;border:0}
.burger span{display:block;height:2px;border-radius:2px;background:var(--ink);transition:.25s}
.search{flex:1;max-width:420px;height:38px;border-radius:20px;background:#f3f5f8;display:flex;align-items:center;gap:9px;padding:0 16px;color:var(--ink-soft);font-size:13px}
.search svg{width:15px;height:15px;flex-shrink:0}
.topbar .spacer{flex:1}
.top-pill{font-size:12px;color:var(--ink-soft);background:#f3f5f8;padding:7px 13px;border-radius:8px;white-space:nowrap}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffa14a,#ff6a88);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.user .meta b{font-size:13px;display:block;line-height:1.2}.user .meta span{font-size:11px;color:var(--ink-soft)}
.content{padding:24px 26px 44px;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-head h1{font-size:21px;font-weight:700}.page-head p{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 15px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px;margin-bottom:18px}
.kpi{border-radius:var(--radius);padding:18px;color:#fff;box-shadow:var(--shadow-kpi);min-height:130px;display:flex;flex-direction:column}
.kpi .lbl{font-size:12.5px;font-weight:600;opacity:.95;line-height:1.3;min-height:32px}
.kpi .val{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;opacity:.85}
.kpi .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.28);margin-top:auto;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:6px;background:#fff}
.kpi .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.95;margin-top:9px;gap:6px}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.22);white-space:nowrap}
.row{display:grid;gap:18px;margin-bottom:18px}
.row.r1{grid-template-columns:1fr 320px}.row.r2{grid-template-columns:1fr 1.15fr}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:15px;font-weight:700}.panel-head .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.legend{display:flex;gap:13px;font-size:11px;color:var(--ink-soft);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.chart-wrap{position:relative;height:270px;margin-top:10px}
.empty{height:200px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;background:#fafbfd;border-radius:10px;margin-top:10px}
.donuts{display:flex;flex-direction:column;gap:6px}
.donut-row{display:flex;align-items:center;gap:16px;padding:9px 2px}
.donut-row+.donut-row{border-top:1px solid var(--line)}
.donut-box{position:relative;width:74px;height:74px;flex-shrink:0}
.donut-box .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.donut-info b{font-size:13.5px;font-weight:700;display:block}
.donut-info span{font-size:11px;color:var(--ink-soft)}
.donut-info .big{font-size:17px;font-weight:800;color:var(--ink);margin-top:2px}
.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:10px}
.rank-item{display:grid;grid-template-columns:1fr 90px 64px;align-items:center;gap:10px}
.rank-item .name{font-size:12.5px;color:var(--ink);line-height:1.25}
.rank-item .name span{display:block;font-size:10px;color:var(--ink-soft)}
.rank-bar{height:8px;border-radius:6px;background:#eff2f7;overflow:hidden}
.rank-bar i{display:block;height:100%;border-radius:6px}
.rank-item .num{font-size:12.5px;font-weight:700;text-align:right}
.ok{color:#22b07d}.warn{color:#e9943b}.bad{color:#e8556b}.nm{color:#a7b1c0}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(20,28,44,.38);z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.mob-overlay.open{display:block;opacity:1;pointer-events:auto}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--mob-bar);background:#fff;border-top:1px solid var(--line);z-index:25;justify-content:space-around;align-items:stretch}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;color:var(--ink-soft);cursor:pointer;border:0;background:transparent;font-family:inherit;font-weight:500;padding:4px 2px}
.bn-item svg{width:20px;height:20px;stroke:var(--ink-soft)}
.bn-item.active{color:var(--brand)}.bn-item.active svg{stroke:var(--brand)}
@media(max-width:1080px){.row.r1,.row.r2{grid-template-columns:1fr}.rank-grid{grid-template-columns:1fr}}
@media(max-width:680px){
  .sidebar{position:fixed;left:0;top:0;height:100%;width:230px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 24px rgba(20,28,44,.15)}
  .sidebar.open{transform:translateX(0)}.burger{display:flex}.search{max-width:none;font-size:12px}
  .top-pill{display:none}.user .meta{display:none}.topbar{padding:0 14px;gap:10px}
  .bottom-nav{display:flex}.content{padding:14px 12px calc(var(--mob-bar) + 16px)}
  .page-head{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:14px}
  .page-head h1{font-size:17px}.page-head p{font-size:11.5px}.seg button{padding:7px 11px;font-size:11.5px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{min-height:108px;padding:12px}.kpi .val{font-size:22px}.kpi .lbl{font-size:11px;min-height:26px}
  .kpi .foot{font-size:10px}.badge{font-size:9px;padding:2px 6px}
  .panel{padding:12px 12px}.panel-head h3{font-size:14px}.row{gap:10px;margin-bottom:10px}
  .chart-wrap{height:200px}.rank-grid{grid-template-columns:1fr;gap:8px}
  .rank-item{grid-template-columns:1fr 56px 50px;gap:8px}
  .rank-item .name{font-size:11.5px}.rank-item .name span{font-size:9.5px}.rank-item .num{font-size:11.5px}.rank-bar{height:7px}
  .donut-box{width:60px;height:60px}.donut-box .center{font-size:12px}
  .donut-info b{font-size:12px}.donut-info .big{font-size:14px}.donut-info span{font-size:10.5px}
  .legend{gap:8px;font-size:10.5px}
}
@media(max-width:400px){.kpis{grid-template-columns:1fr}.kpi{min-height:100px}}
</style>
</head>

/* ── MAPEAMENTO ────────────────────────────────────────────── */
const CAT_MAP={satisfacao_clientes:'clientes',taxa_conversao_orcamentos:'clientes',conversao_amostras:'clientes',assertividade_amostras:'clientes',pontualidade_entrega:'clientes',reclamacao_clientes:'clientes',giro_estoque_mp:'estoque',produtos_acabados_parado:'estoque',tempo_produtivo:'producao',perdas_flexo:'producao',perdas_offset:'producao',perdas_digital:'producao',nc_internas:'producao',igf:'fornecedores',pesquisa_clima:'pessoas',avaliacoes_desempenho:'pessoas',consumo_energia:'ambiente',consumo_agua:'ambiente',descarte_aparas:'ambiente',descarte_nao_reciclado:'ambiente',emissao_gee:'ambiente'};
const FMT_MAP={percent:'pct',decimal1:'num1',decimal3:'num3'};
const MES_KEYS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MES_LABEL=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

/* ── ESTADO GLOBAL ─────────────────────────────────────────── */
let IND=[],SGI={},MESES=[],META_GLOBAL=0.80;

/* ── INIT ──────────────────────────────────────────────────── */
async function init(){
  let raw=window.__DATA__;
  try{const r=await fetch('data.json?v='+Date.now());if(r.ok)raw=await r.json();}catch(_){}
  processRaw(raw);
  Chart.defaults.font.family="'Inter',sans-serif";
  Chart.defaults.color="#8a97a8";
  navigate('visao-geral');
}

function processRaw(raw){
  META_GLOBAL=raw.meta.global_target??0.80;
  const lastIdx=MES_KEYS.reduce((li,m,i)=>{
    const has=raw.indicators.some(ind=>ind.values[m]!=null)||raw.monthly_results[m]!=null;
    return has?i:li;
  },-1);
  const range=MES_KEYS.slice(0,Math.max(lastIdx+1,4));
  MESES=range.map(m=>MES_LABEL[MES_KEYS.indexOf(m)]);
  IND=raw.indicators.map(ind=>({
    id:ind.id,cat:CAT_MAP[ind.id]||'visao-geral',nome:ind.name,
    tipo:ind.type,meta:ind.target,better:ind.better,
    fmt:FMT_MAP[ind.format]||'num',
    serie:range.map(m=>ind.values[m]??null)
  }));
  const sgiSerie=range.map(m=>raw.monthly_results[m]??null);
  SGI={meta:META_GLOBAL,serie:sgiSerie,mensalPct:sgiSerie.map(v=>v!=null?+(v*100).toFixed(2):null)};
  const f=MESES[0],l=MESES[MESES.length-1];
  document.getElementById('topPill').textContent=(f===l?f:f+' – '+l)+' / 2026';
}

/* ── HELPERS ───────────────────────────────────────────────── */
function lastVal(s){for(let i=s.length-1;i>=0;i--)if(s[i]!=null)return s[i];return null;}
function br(n,c){return n.toFixed(c).replace('.',',');}
function fmtVal(ind,v){
  if(v==null)return'—';
  const av=Math.abs(v);
  switch(ind.fmt){
    case'pct':return br(av*100,1)+'%';
    case'num1':return br(v,1);
    case'num3':return br(v,3);
    default:return br(v,2);
  }
}
function fmtMeta(ind){
  const m=ind.meta;
  switch(ind.fmt){
    case'pct':return br(m*100,0)+'%';
    case'num1':return br(m,1);
    case'num3':return br(m,3);
    default:return br(m,2);
  }
}
function statusOf(ind){
  const v=lastVal(ind.serie);
  if(v==null)return'nm';
  return ind.better==='lower'?v<=ind.meta?'ok':'bad':v>=ind.meta?'ok':'bad';
}
function barPct(ind){
  const v=lastVal(ind.serie);
  if(v==null)return 0;
  if(ind.better==='lower'){
    if(ind.meta<=0)return 50;
    const ratio=v/ind.meta;
    return Math.min(100,Math.max(0,(2-ratio)*50));
  }
  return Math.min(100,Math.max(0,v/ind.meta*100));
}
function badge(st){
  if(st==='ok')return'<span class="badge">✓ Atingida</span>';
  if(st==='bad')return'<span class="badge">✗ Não atingida</span>';
  return'<span class="badge">— Não monitorado</span>';
}

/* ── PALETA ────────────────────────────────────────────────── */
const PAL=[['#7b6cf6','#a78bfa'],['#3aa0ff','#36d1dc'],['#ff7a8a','#ff5c72'],['#ffaf45','#ff8a4c'],['#22b07d','#43e97b'],['#f857a6','#ff5858'],['#4e7cff','#6a8dff'],['#11998e','#38ef7d']];
const SOLID=PAL.map(p=>p[0]);

/* ── KPI CARD ──────────────────────────────────────────────── */
function kpiCard(ind,idx){
  const v=lastVal(ind.serie),st=statusOf(ind),[c1,c2]=PAL[idx%PAL.length];
  let valTxt=v==null?'—':ind.fmt==='pct'?br(Math.abs(v)*100,1)+'<small>%</small>':fmtVal(ind,v);
  return`<div class="kpi" style="background:linear-gradient(135deg,${c1},${c2})">
    <div class="lbl">${ind.nome}</div>
    <div class="val">${valTxt}</div>
    <div class="bar"><i style="width:${barPct(ind)}%"></i></div>
    <div class="foot"><span>${ind.tipo==='limite'?'Limite ':'Meta '}${fmtMeta(ind)}</span>${badge(st)}</div>
  </div>`;
}

/* ── CHARTS ────────────────────────────────────────────────── */
let charts=[];
function clearCharts(){charts.forEach(c=>c.destroy());charts=[];}
function lineFor(id,inds){
  const ctx=document.getElementById(id)?.getContext('2d');if(!ctx)return;
  charts.push(new Chart(ctx,{type:'line',data:{labels:MESES,datasets:inds.map((ind,k)=>({label:ind.nome,data:ind.serie,borderColor:SOLID[k%SOLID.length],backgroundColor:'transparent',tension:.4,borderWidth:2.6,pointRadius:3,pointBackgroundColor:SOLID[k%SOLID.length],spanGaps:true}))},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#f0f2f6'},ticks:{callback:v=>br(v,2)}},x:{grid:{display:false}}}}}));
}
function legendFor(inds){return inds.map((i,k)=>`<span><i style="background:${SOLID[k%SOLID.length]}"></i>${i.nome}</span>`).join('');}
function donut(id,val,color){
  const el=document.getElementById(id);if(!el)return;
  charts.push(new Chart(el,{type:'doughnut',data:{datasets:[{data:[Math.max(0,val),Math.max(0,100-val)],backgroundColor:[color,'#eef1f6'],borderWidth:0,cutout:'74%'}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}}}}));
}

/* ── CATS ──────────────────────────────────────────────────── */
const CATS={'visao-geral':{nome:'Visão Geral do SGI',desc:'Monitoramento de objetivos da qualidade e ambientais — ISO 9001 · ISO 14001 · FSC'},clientes:{nome:'Clientes & Comercial',desc:'Satisfação, conversão, assertividade, pontualidade e reclamações'},estoque:{nome:'Estoque',desc:'Giro de matéria-prima e de produtos acabados'},producao:{nome:'Produção',desc:'Tempo produtivo, perdas por processo (Flexo · Offset · Digital) e não conformidades'},fornecedores:{nome:'Fornecedores',desc:'Índice geral de desempenho de fornecedores (IGF)'},pessoas:{nome:'Pessoas (RH)',desc:'Clima organizacional e avaliações de desempenho'},ambiente:{nome:'Meio Ambiente',desc:'Consumo de energia e água, descarte de resíduos e emissões de GEE'},resultado:{nome:'Resultado SGI',desc:'Atendimento consolidado aos objetivos do sistema de gestão'}};

/* ── VIEW CATEGORIA ────────────────────────────────────────── */
function viewCategory(cat){
  const inds=IND.filter(i=>i.cat===cat);
  const plot=inds.filter(i=>i.serie.filter(x=>x!=null).length>=2);
  const chartBlock=plot.length?`<div class="legend">${legendFor(plot)}</div><div class="chart-wrap"><canvas id="catChart"></canvas></div>`:`<div class="empty">Sem série mensal monitorada no período.</div>`;
  return`${head(cat)}<section class="kpis">${inds.map((i,k)=>kpiCard(i,k)).join('')}</section>
  <div class="panel"><div class="panel-head"><div><h3>Evolução no Período</h3><div class="sub">Valores mensais — ${sub()}</div></div></div>${chartBlock}</div>`;
}

/* ── VIEW RESULTADO ────────────────────────────────────────── */
function viewResultado(){
  const liIdx=SGI.serie.reduce((bi,v,i)=>v!=null?i:bi,-1);
  const lastSGI=liIdx>=0?SGI.serie[liIdx]:null;
  const lastMes=liIdx>=0?MESES[liIdx]:'—';
  const vals=SGI.serie.filter(v=>v!=null);
  const media=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  const bestIdx=SGI.serie.reduce((bi,v,i)=>v!=null&&(bi<0||v>SGI.serie[bi])?i:bi,-1);
  const bestMes=bestIdx>=0?MESES[bestIdx]:'—';
  const bestVal=bestIdx>=0?SGI.serie[bestIdx]:null;
  const monitored=IND.filter(i=>liIdx>=0&&i.serie[liIdx]!=null);
  const atingidos=monitored.filter(i=>{const v=i.serie[liIdx];return i.better==='lower'?v<=i.meta:v>=i.meta;});
  const atingPct=monitored.length?Math.round(atingidos.length/monitored.length*100):0;
  const pctMeta=lastSGI!=null?Math.min(100,Math.round(lastSGI/META_GLOBAL*100)):0;
  const prev=liIdx>0?SGI.serie.slice(0,liIdx).filter(v=>v!=null):[];
  const prevVal=prev.length?prev[prev.length-1]:null;
  const tend=lastSGI==null?'—':prevVal==null?'↔':lastSGI>prevVal?'↑':lastSGI<prevVal?'↓':'→';
  const f=v=>v!=null?br(v*100,1)+'<small>%</small>':'—';
  return`${head('resultado')}
  <section class="kpis">
    <div class="kpi" style="background:linear-gradient(135deg,#7b6cf6,#a78bfa)"><div class="lbl">Resultado SGI — ${lastMes}</div><div class="val">${f(lastSGI)}</div><div class="bar"><i style="width:${pctMeta}%"></i></div><div class="foot"><span>Meta ${br(META_GLOBAL*100,0)}%</span><span class="badge">${pctMeta}% da meta</span></div></div>
    <div class="kpi" style="background:linear-gradient(135deg,#3aa0ff,#36d1dc)"><div class="lbl">Média do Período</div><div class="val">${f(media)}</div><div class="bar"><i style="width:${media!=null?Math.min(100,Math.round(media/META_GLOBAL*100)):0}%"></i></div><div class="foot"><span>Meta ${br(META_GLOBAL*100,0)}%</span><span class="badge">${media!=null&&media>=META_GLOBAL?'Acima':'Abaixo'} da meta</span></div></div>
    <div class="kpi" style="background:linear-gradient(135deg,#22b07d,#43e97b)"><div class="lbl">Indicadores Atingidos</div><div class="val">${atingidos.length}<small>/${monitored.length}</small></div><div class="bar"><i style="width:${atingPct}%"></i></div><div class="foot"><span>Monitorados em ${lastMes}</span><span class="badge">${atingPct}%</span></div></div>
    <div class="kpi" style="background:linear-gradient(135deg,#ffaf45,#ff8a4c)"><div class="lbl">Melhor Mês</div><div class="val">${bestMes}</div><div class="bar"><i style="width:${bestVal!=null?Math.round(bestVal*100):0}%"></i></div><div class="foot"><span>${f(bestVal)}</span><span class="badge">Tendência ${tend}</span></div></div>
  </section>
  <section class="row r2">
    <div class="panel"><div class="panel-head"><div><h3>Atendimento aos Objetivos</h3><div class="sub">Resultado SGI vs. meta de ${br(META_GLOBAL*100,0)}%</div></div></div><div class="chart-wrap"><canvas id="sgiLine"></canvas></div></div>
    <div class="panel"><div class="panel-head"><div><h3>Resultado por Mês</h3><div class="sub">% de atendimento — ${sub()}</div></div></div><div class="chart-wrap"><canvas id="sgiBar"></canvas></div></div>
  </section>`;
}

      ]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{suggestedMin:.3,suggestedMax:1.05,grid:{color:'#f0f2f6'},ticks:{callback:v=>(v*100).toFixed(0)+'%'}},x:{grid:{display:false}}}}}));
    }
    const p1=lastSGI!=null?Math.min(100,Math.round(lastSGI/META_GLOBAL*100)):0;
    const p2=igfV!=null&&igf?Math.min(100,Math.round(igfV/igf.meta*100)):0;
    const p3=tempoV!=null&&tempo?Math.min(100,Math.round(tempoV/tempo.meta*100)):0;
    donut('dv1',p1,'#7b6cf6');donut('dv2',p2,'#3aa0ff');donut('dv3',p3,'#22b07d');
  }
  else if(cat==='resultado'){
    const ctx=document.getElementById('sgiLine')?.getContext('2d');
    if(ctx){
      const g=ctx.createLinearGradient(0,0,0,240);g.addColorStop(0,'rgba(123,108,246,.20)');g.addColorStop(1,'rgba(123,108,246,0)');
      charts.push(new Chart(ctx,{type:'line',data:{labels:MESES,datasets:[
        {label:'SGI',data:SGI.serie,borderColor:'#7b6cf6',backgroundColor:g,fill:true,tension:.45,borderWidth:3,pointBackgroundColor:'#7b6cf6',pointRadius:4,spanGaps:true},
        {label:'Meta',data:MESES.map(()=>META_GLOBAL),borderColor:'#c9cfdb',borderDash:[6,5],borderWidth:2,pointRadius:0,fill:false}
      ]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{suggestedMin:.3,suggestedMax:1,grid:{color:'#f0f2f6'},ticks:{callback:v=>(v*100).toFixed(0)+'%'}},x:{grid:{display:false}}}}}));
    }
    const bc=['#a78bfa','#ff7a8a','#ffaf45','#7b6cf6','#3aa0ff','#22b07d','#f857a6','#4e7cff','#11998e','#ff5c72','#38ef7d','#ffaf45'];
    const barEl=document.getElementById('sgiBar');
    if(barEl)charts.push(new Chart(barEl,{type:'bar',data:{labels:MESES,datasets:[{data:SGI.mensalPct,backgroundColor:MESES.map((_,i)=>bc[i%bc.length]),borderRadius:8,barPercentage:.6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,suggestedMax:100,grid:{color:'#f0f2f6'},ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}}}}));
  }
  else{
    const inds=IND.filter(i=>i.cat===cat);
    const plot=inds.filter(i=>i.serie.filter(x=>x!=null).length>=2);
    if(plot.length)lineFor('catChart',plot);
  }
}

/* ── DRAWER / NAV ──────────────────────────────────────────── */
function openDrawer(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('open');}
function closeDrawer(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');}
function navigate(cat){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.cat===cat));
  document.querySelectorAll('.bn-item').forEach(n=>n.classList.toggle('active',n.dataset.cat===cat));
  closeDrawer();clearCharts();
  const c=document.getElementById('content');
  c.innerHTML=cat==='visao-geral'?viewOverview():cat==='resultado'?viewResultado():viewCategory(cat);
  buildCharts(cat);window.scrollTo(0,0);
}

init();
</script>
</body>
</html>
